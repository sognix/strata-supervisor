#
# Runs the unit tests, then builds one image per Strata flavor on GitHub-hosted runners and
# publishes them to GitHub Container Registry (ghcr.io/<owner>/strata-supervisor), all in one
# package, told apart by the tag suffix:
#
#   pull request     -> tests + build + smoke test of every flavor (nothing is pushed)
#   merge into main  -> same + push :dev-<flavor>   (development builds)
#   tag v1.2.3       -> same + push :1.2.3-<flavor>, :1.2-<flavor> and :latest-<flavor> (releases)
#   manual run       -> like a push to the branch/tag it runs on; optionally another Strata version
#
# The default flavor (cuda13) also gets the tags without suffix (:dev, :1.2.3, :1.2, :latest).
# :latest and :latest-<flavor> only ever change through a version tag.
#
# Flavors are Strata's image flavors (docs/DOCKER.md): cuda13 NVIDIA RTX 20-50 with driver 580+,
# cuda12 older NVIDIA (GTX 10, P100, V100) or driver 575-579, rocm-gfx120x AMD RX 9000 / R9700,
# rocm-gfx110x AMD RX 7000, rocm-gfx1151 AMD Strix Halo. Not built: sycl (Intel Arc), because the
# web UI has no card query for it and Strata does not download models for Arc in the container.
#
# The flavors are independent: each one is its own job and they run in parallel. One failing
# flavor does not cancel the others. Every image carries its Strata base image as the label
# "strata.base". Runners have no GPU: the smoke test checks that the web UI starts, reports the
# missing card and keeps the API port placeholder up.

name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      strata_version:
        description: "Strata version for all flavors (e.g. 0.2.12). Empty = the default in the Dockerfile."
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strata-supervisor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s test/python -v

      # A release tag needs its notes: a section "## [vX.Y.Z]" in CHANGELOG.md and "### vX.Y.Z" in
      # <Changes> of the Unraid template. Without them no image is built or pushed for the tag.
      # release.py (local, not in the repo) writes both before the tag is made.
      - name: Release notes present
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$GITHUB_REF_NAME"
          ok=1
          grep -qF "## [$V]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section '## [$V]'"; ok=0; }
          grep -qF "### $V&#xD;" unraid/strata-supervisor.xml \
            || { echo "::error::unraid/strata-supervisor.xml has no '### $V' in <Changes>"; ok=0; }
          [ "$ok" = "1" ]

  build:
    needs: test
    runs-on: ubuntu-latest
    name: build (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [cuda13, cuda12, rocm-gfx120x, rocm-gfx110x, rocm-gfx1151]
    env:
      DEFAULT_FLAVOR: cuda13
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Strata base image
        id: strata
        env:
          PINNED: ${{ inputs.strata_version }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          if [ -n "$PINNED" ]; then
            VERSION="$PINNED"
          else
            VERSION=$(sed -n 's/^ARG STRATA_VERSION=//p' Dockerfile)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the Strata version"
            exit 1
          fi
          echo "Building on ghcr.io/niko1221/strata:$VERSION-$FLAVOR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The web UI shows its own version: "1.0.0" from a tag v1.0.0, else "dev" plus the commit.
          case "$GITHUB_REF" in
            refs/tags/v*) echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "app_version=dev" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Every tag carries the flavor as suffix; the default flavor also gets the plain tags.
      # latest=false: the action would otherwise add a plain :latest to every flavor's release.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.flavor }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.flavor }}
            type=raw,value=latest-${{ matrix.flavor }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev-${{ matrix.flavor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr,suffix=-${{ matrix.flavor }}
            type=semver,pattern={{version}},enable=${{ matrix.flavor == env.DEFAULT_FLAVOR }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.flavor == env.DEFAULT_FLAVOR }}
            type=raw,value=latest,enable=${{ matrix.flavor == env.DEFAULT_FLAVOR && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ matrix.flavor == env.DEFAULT_FLAVOR && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Strata Supervisor
            org.opencontainers.image.description=Web UI to manage Strata models and load them by hand, one at a time
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # into the local docker engine, for the smoke test below
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STRATA_VERSION=${{ steps.strata.outputs.version }}
            STRATA_FLAVOR=${{ matrix.flavor }}
            VERSION=${{ steps.strata.outputs.app_version }}
            COMMIT=${{ steps.strata.outputs.commit }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

      - name: Smoke test
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          docker run -d --name smoke -p 8081:8081 -p 8080:8080 "$IMAGE_ID"

          healthy=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/health >/dev/null; then
              echo "Web UI is up"
              healthy=1
              break
            fi
            sleep 2
          done

          ok=1
          [ "$healthy" = "1" ] || { echo "::error::web UI never became healthy"; ok=0; }
          curl -sf http://localhost:8081/ | grep -q "Strata Supervisor" \
            || { echo "::error::page not served"; ok=0; }
          for f in app.js style.css logo.svg; do
            curl -sf -o /dev/null "http://localhost:8081/$f" || { echo "::error::$f not served"; ok=0; }
          done
          # No GPU on the runner: the start checks must fail cleanly and block loading.
          curl -sf http://localhost:8081/api/status \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["checks"]["errors"] and not s["checks"]["can_load"], s["checks"]' \
            || { echo "::error::/api/status does not report the missing GPU"; ok=0; }
          # API port placeholder: empty model list, 503 for everything else.
          curl -sf http://localhost:8080/v1/models | grep -q '"data": \[\]' \
            || { echo "::error::placeholder /v1/models wrong"; ok=0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/v1/chat/completions)
          [ "$code" = "503" ] || { echo "::error::placeholder answered $code instead of 503"; ok=0; }
          # docker stop must stay well under Unraid's default 10 s.
          start=$(date +%s)
          docker stop smoke >/dev/null
          took=$(( $(date +%s) - start ))
          echo "docker stop took ${took}s"
          [ "$took" -lt 10 ] || { echo "::error::docker stop took ${took}s"; ok=0; }

          docker logs smoke
          docker rm -f smoke >/dev/null
          [ "$ok" = "1" ]

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pushed with buildx from the build cache (same inputs as the tested build), not with
      # "docker push": newer Docker engines push an OCI image manifest, which the Unraid update
      # check can't read ("not available"). Docker media types and no provenance give a plain
      # Docker v2 manifest. A run on any other branch produces no tags - then it was a test build only.
      - name: Push
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STRATA_VERSION=${{ steps.strata.outputs.version }}
            STRATA_FLAVOR=${{ matrix.flavor }}
            VERSION=${{ steps.strata.outputs.app_version }}
            COMMIT=${{ steps.strata.outputs.commit }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
