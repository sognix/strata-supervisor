name: Bug report
description: Something in the web UI or the image doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Problems with Strata itself (model quality, speed, engine crashes)
        usually belong in the [Strata repository](https://github.com/Niko1221/Strata/issues).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image tag
      description: e.g. `ghcr.io/sognix/strata-supervisor:1.0.0`, `:latest` or `:dev`
    validations:
      required: true
  - type: input
    id: gpus
    attributes:
      label: GPU(s)
      description: As listed on the Hardware page, e.g. "0 NVIDIA GeForce RTX 3090, 1 NVIDIA GeForce RTX 5060 Ti"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: e.g. "Unraid 7.3, Nvidia-Driver plugin 580.x, 48 GB RAM"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Model config
      description: The file /config/models/<name>.toml of the affected model config
      render: toml
  - type: textarea
    id: log
    attributes:
      label: Launch and engine log
      description: From the config's Logs tab (the API key is hidden there)
      render: text
  - type: textarea
    id: container-log
    attributes:
      label: Container log (if the UI itself misbehaves)
      description: "`docker logs <container>`"
      render: text
